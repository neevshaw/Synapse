<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse - Sign Up</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="icon" href="static/fav.png" type="image/x-icon">
  <style>
    .flash-messages { margin-bottom: 20px; }
    .flash-error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    .flash-success { color: #155724; background: #d4edda; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #007bff; text-decoration: none; }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
    }

    .login-card {
      background-color: #1b263b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .login-card h2 {
      color: #e0e1dd;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: #778da9;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .login-card form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-card label {
      text-align: left;
      font-weight: bold;
      color: #e0e1dd;
      margin-bottom: 0.3rem;
    }

    .login-card input[type="email"], .login-card input[type="password"], select, .login-card input[type="text"] {
      padding: 0.6rem;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 1rem;
      background-color: #415a77;
      color: #e0e1dd;
    }



    .login-card input[type="email"]::placeholder, .login-card input[type="password"]::placeholder, .login-card input[type="text"]::placeholder {
        color: #cdd2d9;
    }

    .login-card button {
      background-color: #415a77;
      color: #e0e1dd;
      padding: 0.7rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .login-card button:hover {
      background-color: #778da9;
      color: #0d1b2a;
      transform: translateY(-2px);
    }

    .form-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      padding: 2rem;
    }

    .form-note {
      color: #e0e1dd;
      margin-top: 1rem;
    }

    .form-note a {
      color: #778da9;
      text-decoration: none;
      font-weight: bold;
    }

    .form-note a:hover {
      color: #415a77;
    }
  </style>
</head>
<body>
  <header>
    <img onclick="window.location.href='/learn'" style="cursor: pointer; width: 16rem" src="static/synapse.png">
    <nav>
      <a href="/">Home</a>
      <a href="/login">Login</a>
      <a href="/signup" class="active">Sign Up</a>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <h2>Create Your Account</h2>
      <p class="login-subtitle">Join the Synapse platform today</p>

      <div class="flash-messages">
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>

      <form method="post">
        <label for="full_name">Full Name</label>
        <input name="full_name" type="text" id="full_name" placeholder="Enter your full name" value="{{ name }}" required>

        <label for="email">Email</label>
        <input name="email" type="email" id="email" placeholder="Enter your email" value="{{ email }}" required>

        <label for="password">Password</label>
        <input name="password" type="password" id="password" placeholder="Enter your password" value="{{ password }}" required>

        <label for="confirm_password">Confirm Password</label>
        <input name="confirm_password" type="password" id="confirm_password" placeholder="Confirm your password" value="{{ confrim_password }}" required>
        <div id="password-match" class="password-match"></div>

        <label for="account_type">Account Type:</label>
        <select name="account_type" id="account_type" required>
            <option value="" disabled selected>Select Account Type</option>
            <option value="personal" {% if account == "personal" %}selected{% endif %}>Student</option>
            <option value="business" {% if account == "business" %}selected{% endif %}>Business</option>
        </select>

        <button type="submit">Sign Up</button>
      </form>

      <p class="form-note">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Synapse. All rights reserved.</p>
  </footer>
</body>
</html>

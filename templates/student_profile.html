<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse - Student Profile</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="static/fav.png" type="image/x-icon">
    <style>
        .flash-messages { margin-bottom: 20px; }
        .flash-success { color: #155724; background: #d4edda; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .profile-form {
            background-color: #1b263b;
            padding: 2rem;
            border-radius: 10px;
            max-width: 600px;
            margin: 2rem auto;
            box-shadow: 0 6px 10px rgba(0,0,0,0.5);
        }

        .profile-form .form-group {
            margin-bottom: 1.5rem;
        }

        .profile-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #778da9;
        }

        .profile-form input[type="text"],
        .profile-form input[type="number"],
        .profile-form select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.7rem;
            border: none;
            border-radius: 5px;
            background-color: #415a77;
            color: #e0e1dd;
            font-size: 1rem;
        }

        .profile-form input[type="checkbox"] {
            width: auto;
            margin-right: 0.5rem;
        }

        .profile-form input::placeholder {
            color: #cdd2d9;
        }

        .profile-form input:focus,
        .profile-form select:focus {
            outline: 2px solid #778da9;
        }

        .profile-form .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 1rem;
            background-color: #415a77;
            padding: 1rem;
            border-radius: 5px;
        }

        .profile-form .checkbox-group label {
            font-weight: normal;
            color: #e0e1dd;
            display: flex;
            align-items: center;
        }

        .profile-form .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 5px;
            background-color: #415a77;
            color: #e0e1dd;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .profile-form .btn:hover {
            background-color: #778da9;
            color: #0d1b2a;
        }

        /* Align buttons: Save left, Logout right */
        .form-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }
        .logout-btn {
            background-color: #ff4d4d !important;
            color: #ffffff !important;
        }

        .logout-btn:hover {
            background-color: #e60000 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>
    <header>
        <img onclick="window.location.href='/learn'" style="cursor: pointer; width: 16rem" src="static/synapse.png">
        <nav>
            <a href="/learn">Learn</a>
            <a href="/projects">Projects</a>
            <a href="/profile" class="active">Profile</a>
        </nav>
    </header>

    <main>
        <h1 onclick="window.location.href='/learn'">Student Profile</h1>
        <div class="flash-messages">
            {% for category, message in get_flashed_messages(with_categories=true) %}
                <center><div class="flash-{{ category }}" style="width: 50%;">{{ message }}</div></center>
            {% endfor %}
        </div>
        <form class="profile-form" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" value="{{ user.name }}" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" value="{{ user.age }}">
            </div>

            <div class="form-group">
                <label for="grade">Grade</label>
                <select id="grade" name="grade">
                    <option value="" disabled selected>Select your grade</option>
                    <option value="9" {% if user.grade == "9" %}selected{% endif %}>9th Grade</option>
                    <option value="10" {% if user.grade == "10" %}selected{% endif %}>10th Grade</option>
                    <option value="11" {% if user.grade == "11" %}selected{% endif %}>11th Grade</option>
                    <option value="12" {% if user.grade == "12" %}selected{% endif %}>12th Grade</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">Where You Live</label>
                <input type="text" id="location" name="location" placeholder="City, State/Country" {% if user.location != None %}value="{{ user.location }}"{% endif %}>
            </div>

            <div class="form-group">
                <label>Topics You Would Be Interested in Learning</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="interests" value="1" {% if user.interests[0] == "1" %}checked{% endif %}> AI and Machine Learning</label>
                    <label><input type="checkbox" name="interests" value="2" {% if user.interests[1] == "1" %}checked{% endif %}> Creating Mobile Apps</label>
                    <label><input type="checkbox" name="interests" value="3" {% if user.interests[2] == "1" %}checked{% endif %}> Turning Data into Insights</label>
                    <label><input type="checkbox" name="interests" value="4" {% if user.interests[3] == "1" %}checked{% endif %}> Growing Online Presence Efficiently</label>
                    <label><input type="checkbox" name="interests" value="5" {% if user.interests[4] == "1" %}checked{% endif %}> Connecting Different Platforms Together</label>
                    <label><input type="checkbox" name="interests" value="6" {% if user.interests[5] == "1" %}checked{% endif %}> Building Interactive Websites</label>
                    <label><input type="checkbox" name="interests" value="7" {% if user.interests[6] == "1" %}checked{% endif %}> Launching Online Stores</label>
                    <label><input type="checkbox" name="interests" value="8" {% if user.interests[7] == "1" %}checked{% endif %}> Collecting Data Autonomously</label>
                    <label><input type="checkbox" name="interests" value="9" {% if user.interests[8] == "1" %}checked{% endif %}> Running Projects in the Cloud</label>
                    <label><input type="checkbox" name="interests" value="10" {% if user.interests[9] == "1" %}checked{% endif %}> Saving Time on Repetitive Tasks</label>
                </div>
            </div>

            <div class="form-buttons">
                <input type="submit" class="btn" value="Save Profile">
                <a href="/logout">
                    <input type="button" class="btn logout-btn" value="Logout">
                </a>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Synapse. All rights reserved.</p>
    </footer>
</body>
</html>
